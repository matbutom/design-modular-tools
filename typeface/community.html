<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creaciones - Editor Tipográfico</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Wix+Madefor+Display:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="community-app">

  <!-- Minimal top nav -->
  <nav class="topbar">
    <span class="topbar-title">Creaciones</span>
    <div class="topbar-nav">
      <a href="../index.html" class="nav-link">Inicio</a>
      <a href="index.html" class="nav-link">Editor</a>
      <a href="../drawing/index.html" class="nav-link">Dibujo libre</a>
    </div>
  </nav>

  <!-- Sticky controls: sample text -->
  <div class="community-controls">
    <input
      type="text"
      id="sampleText"
      class="sample-input"
      value="El veloz murciélago hindú comía feliz cardillo y kiwi"
      placeholder="Escribe aquí para previsualizar todas las fuentes…"
    >
  </div>

  <!-- Font list -->
  <main class="font-list" id="fontList"></main>

  <!-- Empty state -->
  <div id="emptyState" class="community-empty" style="display:none;">
    <p class="community-empty-icon">◻</p>
    <p class="community-empty-title">Aún no hay tipografías publicadas</p>
    <p class="community-empty-sub">Diseña una tipografía en el editor y presiona <strong>Publicar</strong>.</p>
    <a href="index.html" class="btn btn-primary">Ir al editor</a>
  </div>

  <script src="community.js"></script>
</body>
</html>
