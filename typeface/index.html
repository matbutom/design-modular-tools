<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editor Tipográfico</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Wix+Madefor+Display:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/opentype.js/dist/opentype.min.js"></script>
</head>
<body class="editor-app">

  <!-- Minimal top nav -->
  <nav class="topbar">
    <span class="topbar-title">Editor</span>
    <div class="topbar-nav">
      <a href="../index.html" class="nav-link">Inicio</a>
      <a href="../drawing/index.html" class="nav-link">Dibujo libre</a>
      <a href="community.html" class="nav-link">Creaciones</a>
      <button id="btnMyTypefaces" class="nav-link nav-btn">Mis tipografías</button>
    </div>
  </nav>

  <!-- Editor + alphabet -->
  <main class="editor-main">

    <!-- Left sidebar -->
    <div class="editor-left-bar">
      <span class="typeface-name-badge" id="typefaceNameBadge"></span>
      <button id="btnNewTypeface" class="btn-new-typeface-full">
        <span class="btn-new-plus">+</span>
        <span>Nueva tipografía</span>
      </button>
    </div>

    <section class="editor">
      <div class="editor-header">
        <span class="current-letter" id="currentLetterLabel">A</span>
        <span class="grid-info" id="gridInfo">4×4</span>
      </div>
      <div class="canvas-container">
        <canvas id="editorCanvas"></canvas>
      </div>
    </section>

    <aside class="alphabet" id="alphabetPanel">
      <button class="alphabet-toggle" id="alphabetToggle" aria-label="Toggle abecedario">
        <span class="toggle-arrow">></span>
      </button>
      <div class="alphabet-content">
        <div class="alphabet-tabs">
          <button class="alphabet-tab active" id="tabLetters">Letras</button>
          <button class="alphabet-tab" id="tabSymbols">Símbolos</button>
          <button class="alphabet-tab" id="tabAlts">Alts</button>
        </div>
        <div id="alphabetGrid" class="alphabet-grid"></div>
      </div>
    </aside>
  </main>

  <!-- Bottom controls bar -->
  <div class="bottombar">

    <!-- Letra -->
    <div class="bar-group">
      <div class="letter-nav">
        <button id="btnPrevLetter" class="btn-arrow" title="Letra anterior">←</button>
        <select id="letterSelect" class="select-letter"></select>
        <button id="btnNextLetter" class="btn-arrow" title="Letra siguiente">→</button>
      </div>
      <button id="btnClearLetter" class="btn btn-secondary">Limpiar</button>
    </div>

    <!-- Grilla -->
    <div class="bar-group">
      <div class="stepper">
        <button id="btnDecCols" class="btn-stepper">−</button>
        <span id="colsValue">4</span>
        <button id="btnIncCols" class="btn-stepper">+</button>
      </div>
      <span class="bar-sep">×</span>
      <div class="stepper">
        <button id="btnDecRows" class="btn-stepper">−</button>
        <span id="rowsValue">4</span>
        <button id="btnIncRows" class="btn-stepper">+</button>
      </div>
      <div class="grid-apply-btns">
        <button id="btnApplyOne" class="btn btn-secondary btn-xs" title="Aplicar tamaño a esta letra">Esta</button>
        <button id="btnApplyAll" class="btn btn-secondary btn-xs" title="Aplicar tamaño a todas las letras">Todas</button>
      </div>
    </div>

    <!-- Pincel -->
    <div class="bar-group bar-group-brush">
      <span class="bar-label">Pincel</span>
      <label class="toggle-switch" title="Modo pincel">
        <input type="checkbox" id="toggleBrush" checked>
        <span class="toggle-slider"></span>
      </label>
      <div id="brushControls" style="display: block;">
        <input type="color" id="brushColor" class="color-input" value="#000000">
        <div id="brushShapePicker" class="shape-picker"></div>
        <button id="btnEraser" class="shape-btn" title="Goma de borrar (E)">
          <svg viewBox="0 0 20 20" fill="currentColor"><path d="M3 16h5.5l7-7-5-5-8 8v4zm1.5-1v-2.5l6.5-6.5 2.5 2.5-6.5 6.5H4.5z" opacity=".5"/><path d="M8 16h9v1H3v-1h5zm.5-1L4 10.5l1-1L9.5 14H8.5z"/><path d="M5 15l7-7 3 3-4 4H5z"/></svg>
        </button>
      </div>
    </div>

    <!-- Celda -->
    <div class="bar-group bar-group-preview">
      <div id="cellControls" class="cell-controls" style="display: none;">
        <select id="shapeSelect" class="select select-sm"></select>
        <button id="btnRotate" class="btn">90°</button>
      </div>
      <button id="btnOpenPreview" class="btn btn-preview-open">
        <svg viewBox="0 0 16 16" fill="currentColor" width="12" height="12"><path d="M8 3C4.5 3 1.5 5.5 1 8c.5 2.5 3.5 5 7 5s6.5-2.5 7-5c-.5-2.5-3.5-5-7-5zm0 8a3 3 0 1 1 0-6 3 3 0 0 1 0 6zm0-5a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg>
        Previsualizar
      </button>
    </div>

    <!-- Preview hidden (JS still references these) -->
    <input id="previewText" type="text" value="hello world :)" maxlength="24" style="display:none;">
    <canvas id="previewCanvas" style="display:none;"></canvas>

    <!-- Acciones -->
    <div class="bar-group bar-actions">
      <button id="btnSaveTypeface" class="btn btn-save-typeface">Guardar</button>
      <div class="publish-wrap">
        <button id="btnExportFont" class="btn btn-publish">Publicar</button>
        <span id="publishError" class="publish-error" aria-live="polite"></span>
      </div>
      <button id="btnReset" class="btn btn-secondary">Reset</button>
    </div>

  </div>

  <!-- Context Menu -->
  <div id="contextMenu" class="context-menu" style="display: none;">
    <div class="context-menu-content"></div>
  </div>

  <!-- Preview Overlay -->
  <div id="previewOverlay" class="preview-overlay" aria-hidden="true">
    <div class="preview-overlay-topbar">
      <button id="btnClosePreview" class="preview-close" title="Volver al editor">
        <svg viewBox="0 0 16 16" fill="currentColor" width="14" height="14"><path d="M12.5 3.5l-9 9M3.5 3.5l9 9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <span class="preview-overlay-title">Vista previa</span>
      <div class="preview-size-controls">
        <span class="bar-label">Tamaño</span>
        <button id="btnFontSizeDec" class="btn-stepper">−</button>
        <span id="fontSizeLabel">80</span>
        <span class="bar-label">px</span>
        <button id="btnFontSizeInc" class="btn-stepper">+</button>
      </div>
    </div>
    <div class="preview-overlay-stage">
      <canvas id="previewOverlayCanvas"></canvas>
      <p class="preview-empty-hint" id="previewEmptyHint">Escribe algo abajo para ver tu tipografía</p>
    </div>
    <div class="preview-overlay-input-row">
      <input
        type="text"
        id="previewOverlayText"
        class="preview-overlay-input"
        placeholder="Escribe algo aquí..."
        value=""
        maxlength="80"
        autocomplete="off"
        spellcheck="false"
      >
    </div>
  </div>

  <!-- My Typefaces Panel -->
  <div id="myTypefacesPanel" class="mytf-panel" aria-hidden="true">
    <div class="mytf-header">
      <span class="mytf-title">Mis tipografías</span>
      <button id="btnCloseMytf" class="mytf-close" title="Cerrar">
        <svg viewBox="0 0 16 16" fill="currentColor" width="14" height="14"><path d="M12.5 3.5l-9 9M3.5 3.5l9 9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="mytf-body">
      <div class="mytf-empty" id="mytfEmpty">
        <span>Aún no has guardado ninguna tipografía.</span>
        <span>Usa el botón <strong>Guardar tipografía</strong> para empezar.</span>
      </div>
      <div class="mytf-grid" id="mytfGrid"></div>
    </div>
  </div>
  <div id="mytfBackdrop" class="mytf-backdrop"></div>

  <!-- Save Typeface Dialog -->
  <div id="saveTfDialog" class="savetf-dialog" aria-hidden="true">
    <div class="savetf-box">
      <p class="savetf-label">Nombre de la tipografía</p>
      <input id="saveTfName" class="savetf-input" type="text" placeholder="Mi tipografía" maxlength="40" autocomplete="off" spellcheck="false">
      <div class="savetf-actions">
        <button id="btnSaveTfCancel" class="btn btn-secondary">Cancelar</button>
        <button id="btnSaveTfConfirm" class="btn">Guardar</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
